# Orquesta los 3 contenedores de la Tienda Virtual:
#   database -> PostgreSQL 15 (persistencia)
#   api      -> FastAPI + SQLAlchemy (lógica de negocio y acceso a datos)
#   web      -> Flask (frontend, solo consume la API por HTTP)
#
# Los tres se comunican a través de la red interna que Docker Compose crea
# automáticamente para este proyecto. Dentro de esa red, cada servicio es
# alcanzable usando su NOMBRE como si fuera un hostname (por eso la API usa
# "database" como host de conexión, y "web" usa "api").

services:
  database:
    image: postgres:15
    container_name: lp2taller3-database
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
    container_name: lp2taller3-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: >
      sh -c "python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  web:
    build:
      context: ./web
    container_name: lp2taller3-web
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY}
      API_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "5000:5000"

volumes:
  db_data:

